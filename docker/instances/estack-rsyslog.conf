# The container logs of the estack instances. `estack-instance setup` installs it as
# /etc/rsyslog.d/30-estack-docker.conf. See docs/docker.md#several-instances-on-one-host.
#
# Docker sends them to this socket and not to /dev/log, so they stay out of the journal and
# /var/log/syslog, whose size limits other services share. The AppArmor profile of rsyslogd permits a
# socket at /var/lib/*/dev/log. estack-logrotate keeps the files for 30 days.
template(name="EstackDockerFile" type="string" string="/var/log/estack/%programname%.log")
template(name="EstackDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="estack-docker") {
  # The tag is the container name, which estack-instance gives.
  if $programname startswith "estack-" then {
    # setup makes /var/log/estack for syslog, the user of rsyslogd.
    action(type="omfile" dynaFile="EstackDockerFile" template="EstackDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/estack-docker/dev/log" ruleset="estack-docker" createPath="off")
