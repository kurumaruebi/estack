# Docker starts the estack containers when it starts. `estack-instance setup` installs this file as
# /etc/systemd/system/docker.service.d/estack.conf.
[Unit]
# No container starts without its firewall: when estack-firewall fails, Docker does not start.
Requires=estack-firewall.service
After=estack-firewall.service
# A container with the syslog log driver does not start without the rsyslog socket.
Wants=rsyslog.service
After=rsyslog.service
# A container with the LXCFS files of lxcfs.yaml does not start before LXCFS mounts them.
Wants=lxcfs.service
After=lxcfs.service
